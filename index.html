<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chartly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="backend/static/css/advanced.css">
  <style>
    body { background: linear-gradient(135deg, #2c1810 0%, #3e2723 50%, #4e342e 100%); overflow-x: hidden; }
    .login-card { animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; animation-delay: 0.1s; }
    .login-logo { animation: fadeIn 0.6s ease forwards; opacity: 0; }
    .login-title { animation: fadeInUp 0.5s ease forwards; opacity: 0; animation-delay: 0.15s; }
    .login-tagline { animation: fadeInUp 0.5s ease forwards; opacity: 0; animation-delay: 0.25s; }
    .login-form-wrap { animation: fadeInUp 0.5s ease forwards; opacity: 0; animation-delay: 0.35s; }
    .login-footer { animation: fadeIn 0.5s ease forwards; opacity: 0; animation-delay: 0.5s; }
    .mesh-bg-login {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
    }
    .mesh-bg-login::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 60% 50% at 30% 30%, rgba(230, 126, 34, 0.25), transparent),
        radial-gradient(ellipse 50% 60% at 70% 70%, rgba(231, 76, 60, 0.2), transparent),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(243, 156, 18, 0.15), transparent);
    }
    .mesh-bg-login .orb {
      position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.35;
    }
    .mesh-bg-login .orb-1 { width: 500px; height: 500px; background: #e67e22; top: -15%; left: -10%; animation: orbFloat1 18s ease-in-out infinite; }
    .mesh-bg-login .orb-2 { width: 400px; height: 400px; background: #e74c3c; top: 50%; right: -8%; animation: orbFloat2 22s ease-in-out infinite; }
    .mesh-bg-login .orb-3 { width: 350px; height: 350px; background: #f39c12; bottom: -10%; left: 25%; animation: orbFloat3 20s ease-in-out infinite; }
    @keyframes orbFloat1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,80px)} }
    @keyframes orbFloat2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-80px,-60px)} }
    @keyframes orbFloat3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(50px,-70px)} }
    .login-glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .login-input-glass {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }
    .login-input-glass:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(230, 126, 34, 0.6);
      box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.2);
    }
    .login-btn-glass {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .login-btn-glass:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <!-- Background Orbs -->
  <div class="mesh-bg-login">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Content -->
  <div class="min-h-screen flex flex-col items-center justify-center relative z-10 px-4">
    <!-- Logo Icon -->
    <div class="login-logo mb-4">
      <div class="w-11 h-11 rounded-2xl flex items-center justify-center" style="background: linear-gradient(135deg, #e67e22, #d35400); box-shadow: 0 8px 32px rgba(230,126,34,0.4);">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
        </svg>
      </div>
    </div>

    <!-- Brand Name -->
    <h1 class="login-title text-3xl md:text-4xl font-extrabold text-white tracking-tight mb-2" style="font-family: var(--font-heading);">Chartly</h1>

    <!-- Tagline -->
    <p class="login-tagline text-sm md:text-base mb-8 max-w-xs text-center" style="color: rgba(255,255,255,0.5);">Transform raw data into beautiful charts in minutes</p>

    <!-- Login Card -->
    <div class="login-card login-glass-card w-full max-w-sm" style="border-radius: 24px; padding: 2rem;">
      <div class="text-center mb-6">
        <h2 class="text-base font-bold text-white" style="font-family: var(--font-heading);">Welcome back</h2>
        <p class="text-xs mt-1" style="color: rgba(255,255,255,0.4);">Sign in to your workspace</p>
      </div>

      <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="login-form-wrap space-y-3 mb-5">
          <div>
            <label class="block text-xs font-medium mb-1.5" style="color: rgba(255,255,255,0.5);">Email</label>
            <input type="email" value="analyst@company.com" class="login-input-glass" style="width:100%; padding:0.625rem 0.875rem; border-radius: 12px; color: #fff; font-size: 0.8125rem; outline: none; transition: all 0.2s;">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1.5" style="color: rgba(255,255,255,0.5);">Password</label>
            <input type="password" value="password" class="login-input-glass" style="width:100%; padding:0.625rem 0.875rem; border-radius: 12px; color: #fff; font-size: 0.8125rem; outline: none; transition: all 0.2s;">
          </div>
        </div>

        <button type="submit" style="width:100%; padding:0.625rem; background: linear-gradient(135deg, #e67e22, #d35400); color: #fff; font-weight: 600; font-size: 0.8125rem; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s; box-shadow: 0 6px 24px rgba(230,126,34,0.4);"
          onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 32px rgba(230,126,34,0.5)'"
          onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 6px 24px rgba(230,126,34,0.4)'">
          Sign In
        </button>
      </form>

      <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-px" style="background: rgba(255,255,255,0.1);"></div>
        <span class="text-xs" style="color: rgba(255,255,255,0.35);">or</span>
        <div class="flex-1 h-px" style="background: rgba(255,255,255,0.1);"></div>
      </div>

      <div class="grid grid-cols-2 gap-2.5">
        <button class="login-btn-glass" style="padding:0.5rem; border-radius: 12px; color: rgba(255,255,255,0.7); font-size: 0.75rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
          SSO
        </button>
        <button class="login-btn-glass" style="padding:0.5rem; border-radius: 12px; color: rgba(255,255,255,0.7); font-size: 0.75rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
          API Key
        </button>
      </div>
    </div>

    <!-- Footer -->
    <p class="login-footer mt-5 text-xs" style="color: rgba(255,255,255,0.25);">Internal Data Analysis Platform</p>
  </div>

  <script>
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</body>
</html>
