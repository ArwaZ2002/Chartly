<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chartly - Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="backend/static/css/advanced.css">
</head>
<body>
  <div class="mesh-gradient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div class="flex h-screen relative z-10">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar-glass w-64 flex flex-col lg:static inset-y-0 left-0" id="sidebar">
      <div class="p-5 border-b" style="border-color: rgba(255,255,255,0.06);">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, var(--primary), var(--primary-hover)); box-shadow: 0 8px 24px var(--primary-glow);"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg></div>
          <div><h1 class="text-lg font-bold text-white" style="font-family: var(--font-heading);">Chartly</h1><p class="text-xs" style="color: var(--sidebar-text);">Data Analysis</p></div>
        </div>
      </div>
      <!-- Search Trigger -->
      <div class="px-4 pt-4">
        <button onclick="openCommandPalette()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all" style="background: rgba(255,255,255,0.05); color: var(--sidebar-text); border: 1px solid rgba(255,255,255,0.06);">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <span class="flex-1 text-left">Search...</span>
          <span class="text-xs px-1.5 py-0.5 rounded" style="background: rgba(255,255,255,0.08); font-family: monospace;">Ctrl+K</span>
        </button>
      </div>
      <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
        <a href="dashboard.html" class="nav-item-premium"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg><span>Dashboard</span></a>
        <a href="upload.html" class="nav-item-premium"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg><span>Upload Data</span></a>
        <a href="charts.html" class="nav-item-premium"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg><span>Charts</span></a>
        <a href="templates.html" class="nav-item-premium"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg><span>Templates</span></a>
        <a href="audit.html" class="nav-item-premium"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>Audit Trail</span></a>
        <a href="users.html" class="nav-item-premium"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg><span>Users</span></a>
        <a href="settings.html" class="nav-item-premium active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg><span>Settings</span></a>
      </nav>
      <div class="p-4 border-t" style="border-color: rgba(255,255,255,0.06);">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full flex items-center justify-center" style="background: linear-gradient(135deg, var(--secondary), #0770c7);"><span class="text-sm font-bold text-white">A</span></div>
            <div><p class="text-sm font-medium text-white">Analyst</p><p class="text-xs" style="color: var(--sidebar-text);">analyst@company.com</p></div>
          </div>
          <a href="index.html" class="p-2 rounded-lg" style="color: var(--sidebar-text);" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--sidebar-text)'"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg></a>
        </div>
      </div>
    </aside>
    <main class="flex-1 overflow-auto">
      <div class="lg:hidden mobile-header-glass flex items-center gap-4 p-4">
        <button onclick="toggleSidebar()" class="p-2 rounded-lg" style="color: var(--text);"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
        <span class="font-bold" style="font-family: var(--font-heading);">Chartly</span>
      </div>
      <div class="p-6 lg:p-8">
        <div class="mb-6 animate-fadeInUp">
          <h1 class="text-2xl lg:text-3xl font-extrabold" style="font-family: var(--font-heading); color: var(--text);">Settings</h1>
          <p class="mt-1 text-sm" style="color: var(--text-secondary);">Configure your platform preferences.</p>
        </div>
        <div class="max-w-2xl space-y-5">
          <!-- General Settings -->
          <div class="settings-panel animate-fadeInUp delay-1">
            <div class="flex items-center gap-3 mb-5">
              <div class="p-2 rounded-xl" style="background: rgba(230,126,34,0.12);">
                <svg class="w-5 h-5" style="color: var(--primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              </div>
              <h2 class="text-base font-bold" style="font-family: var(--font-heading); color: var(--text);">General Settings</h2>
            </div>
            <div class="space-y-4">
              <div>
                <label class="block text-xs font-medium mb-1.5" style="color: var(--text-secondary);">Platform Name</label>
                <input type="text" value="Chartly" class="input-premium">
              </div>
              <div>
                <label class="block text-xs font-medium mb-1.5" style="color: var(--text-secondary);">Default Chart Type</label>
                <select class="input-premium select-premium">
                  <option>Bar Chart</option>
                  <option>Line Chart</option>
                  <option>Pie Chart</option>
                  <option>Area Chart</option>
                  <option>Scatter Plot</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Appearance -->
          <div class="settings-panel animate-fadeInUp delay-2">
            <div class="flex items-center gap-3 mb-5">
              <div class="p-2 rounded-xl" style="background: rgba(231,76,60,0.12);">
                <svg class="w-5 h-5" style="color: var(--accent);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>
              </div>
              <h2 class="text-base font-bold" style="font-family: var(--font-heading); color: var(--text);">Appearance</h2>
            </div>
            <div class="space-y-4">
              <div class="flex items-center justify-between p-3.5 rounded-xl" style="background: var(--surface);">
                <div>
                  <p class="font-semibold text-sm" style="color: var(--text);">Dark Mode</p>
                  <p class="text-xs" style="color: var(--text-secondary);">Toggle between light and dark themes</p>
                </div>
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
                  <div class="toggle-thumb">
                    <svg class="toggle-icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg class="toggle-icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                  </div>
                </button>
              </div>
              <div>
                <label class="block text-xs font-medium mb-1.5" style="color: var(--text-secondary);">Color Scheme</label>
                <select class="input-premium select-premium">
                  <option>Aurora Borealis (Default)</option>
                  <option>Ocean Blue</option>
                  <option>Forest Green</option>
                  <option>Royal Purple</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Save Button -->
          <div class="flex justify-end animate-fadeInUp delay-3">
            <button class="btn-premium btn-primary-premium" style="padding: 0.625rem 1.25rem;">Save Settings</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme', 'dark');
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
  </script>
</body>
</html>
